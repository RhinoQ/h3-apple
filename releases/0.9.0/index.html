<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121820">
  <meta name="description" content="Watch videos made with h3-apple 0.9.0. Six multi-reference scenes exercise LightX2V Fast and Medium, Pika High and optional super-resolution on Mac.">
  <title>0.9.0 video gallery · h3-apple</title>
  <link rel="stylesheet" href="gallery.css">
  <script src="gallery.js" defer></script>
</head>
<body>
  <a href="#player" class="skip">Skip to video</a>
  <header><div class="bar"><a class="brand" href="../../">h3-apple</a><span class="edition">0.9.0 video gallery</span><a class="github" href="https://github.com/RhinoQ/h3-apple">GitHub ↗</a></div></header>
  <main>
    <article class="feature" aria-labelledby="title">
      <div class="theater"><video id="player" controls playsinline preload="metadata" aria-label="Scene video"></video></div>
      <section class="notes" aria-live="polite">
        <p id="mode" class="mode"></p>
        <h1 id="title">The paintbrush trade</h1>
        <p id="brief" class="brief">A rabbit asks “My turn?” and trades an apple for a bear’s paintbrush at a garden fence.</p>
        <dl id="settings"></dl>
        <div id="files" class="files"></div>
      </section>
    </article>
    <section class="collection" aria-labelledby="scenes-title"><h2 id="scenes-title">Scenes</h2><nav id="scenes" aria-label="Select a scene"></nav></section>
    <p id="status" role="status"></p>
    <noscript><p>Enable JavaScript to select a scene. <a href="films.json">Open the list of video files.</a></p></noscript>
  </main>
  <footer>Generated on a 40-core Apple M5 Max with 128 GiB of memory. Each scene is the first output from its prompt and seed.</footer>
</body>
</html>
