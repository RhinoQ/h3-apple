name: Publish Python package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Publish this tag to PyPI after configuring its Trusted Publisher
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check release version
        run: |
          python - <<'PY'
          import ast, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          tree = ast.parse(pathlib.Path('src/h3_apple/__init__.py').read_text())
          api_version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign)
                             and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert version == api_version == os.environ['GITHUB_REF_NAME'].removeprefix('v')
          PY
      - name: Build and validate distributions
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/h3-apple/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package
          path: dist/
      - name: Verify and stage release assets
        run: |
          # The qualified native engine is unchanged. Pin its immutable source;
          # release_assets.py verifies the archive and every member against engine.json.
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            https://raw.githubusercontent.com/RhinoQ/h3-apple/c61b38c6ab513675e0910de42436ac97442fd587/assets/build/h3-engine-macos-arm64.zip \
            --output engine.zip
          python tools/release_assets.py --dist dist --engine engine.zip \
            --output release --tag "$GITHUB_REF_NAME"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "${GITHUB_REF_NAME} — SOL + X2 by default" \
              --notes-file release/release-notes.md
            gh release upload "$GITHUB_REF_NAME" release/assets/*
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest \
            --title "${GITHUB_REF_NAME} — SOL + X2 by default" \
            --notes-file release/release-notes.md
