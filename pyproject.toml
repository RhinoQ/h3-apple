[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-apple"
version = "0.1.0.dev5+guide3"
description = "Community MiniMax-H3 video and audio generation on Apple Silicon"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES", "licenses/*.txt", "src/h3_apple/runtime/metal/*LICENSE.txt", "src/h3_apple/runtime/metal/*NOTICE.txt"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "mlx==0.32.0", "numpy==2.4.6", "transformers==5.14.1",
  "huggingface-hub==1.26.0", "safetensors==0.8.0", "Pillow==12.3.0",
]

[project.optional-dependencies]
ref2va = ["torch==2.11.0", "torchvision==0.26.0"]

[project.urls]
Homepage = "https://github.com/RhinoQ/h3-apple"
Documentation = "https://github.com/RhinoQ/h3-apple/blob/main/README.md"
Repository = "https://github.com/RhinoQ/h3-apple"
Issues = "https://github.com/RhinoQ/h3-apple/issues"
Releases = "https://github.com/RhinoQ/h3-apple/releases"

[project.scripts]
h3 = "h3_apple.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h3_apple = ["data/*.json", "data/*.npz", "runtime/metal/*.metal", "runtime/metal/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["hardware: requires the tested Apple GPU and prepared model assets"]
