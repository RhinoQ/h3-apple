[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-apple"
version = "0.7.0"
description = "Fast, simple MiniMax-H3 image-reference video generation on Mac"
readme = "README.md"
license = "Apache-2.0 AND MIT AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES", "licenses/*.txt"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "Pillow==12.3.0", "mlx==0.32.0", "mlx-metal==0.32.0", "numpy==2.4.6",
    "transformers==5.14.1", "torch==2.11.0", "torchvision==0.26.0",
    "huggingface-hub==1.26.0", "tokenizers==0.22.2", "safetensors==0.8.0",
]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Video",
]

[project.optional-dependencies]
# Retain existing install commands; both modes are included by default.
VSA = []

[project.urls]
Homepage = "https://github.com/RhinoQ/h3-apple"
Documentation = "https://github.com/RhinoQ/h3-apple/blob/main/README.md"
Repository = "https://github.com/RhinoQ/h3-apple"
Issues = "https://github.com/RhinoQ/h3-apple/issues"
Releases = "https://github.com/RhinoQ/h3-apple/releases"

[project.scripts]
h3 = "h3_apple.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h3_apple = ["data/*.json", "data/*.txt", "data/*.npz", "runtime/metal/*.metal", "runtime/metal/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["hardware: requires the tested Apple GPU and prepared model assets"]
