[build-system]
requires = ["setuptools==81.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-apple"
version = "0.5.0"
description = "Fast, simple MiniMax-H3 image-reference video generation on Mac"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES", "licenses/*.txt"]
requires-python = ">=3.11,<3.15"
dependencies = ["Pillow==12.3.0", "av==18.1.0", "imageio-ffmpeg==0.6.0"]
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/RhinoQ/h3-apple"
Documentation = "https://github.com/RhinoQ/h3-apple/blob/main/README.md"
Repository = "https://github.com/RhinoQ/h3-apple"
Issues = "https://github.com/RhinoQ/h3-apple/issues"
Releases = "https://github.com/RhinoQ/h3-apple/releases"

[project.scripts]
h3 = "h3_apple.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h3_apple = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["hardware: requires the tested Apple GPU and prepared model assets"]
